robot_cfg:
  kinematics:
    use_usd_kinematics: false
    usd_path: null
    usd_robot_root: null
    isaac_usd_path: null
    usd_flip_joints: {}
    usd_flip_joint_limits: {}
    urdf_path: ${ASSETS_PATH}/assets/embodiments/xarm6-g1/xarm6_g1.urdf
    asset_root_path: null
    base_link: link_base
    ee_link: link6
    collision_link_names:
      - link_base
      - link1
      - link2
      - link3
      - link4
      - link5
      - link6
      - xarm_gripper_base_link
      - left_outer_knuckle
      - left_finger
      - left_inner_knuckle
      - right_outer_knuckle
      - right_finger
      - right_inner_knuckle
    collision_spheres: ${ASSETS_PATH}/assets/embodiments/xarm6-g1/collision_xarm6_g1.yml
    collision_sphere_buffer: 0.004
    extra_collision_spheres: null
    use_global_cumul: true
    self_collision_ignore:
      link_base: [link1, link2]
      link1: [link2, link3]
      link2: [link3, link4]
      link3: [link4, link5, link6]
      link4: [link5, link6, left_finger, left_inner_knuckle, right_finger, right_inner_knuckle]
      link5: [link6, xarm_gripper_base_link, left_outer_knuckle, left_finger, left_inner_knuckle, right_outer_knuckle, right_finger, right_inner_knuckle]
      link6: [xarm_gripper_base_link, left_outer_knuckle, left_finger, left_inner_knuckle, right_outer_knuckle, right_finger, right_inner_knuckle]
      xarm_gripper_base_link: [left_outer_knuckle, left_finger, left_inner_knuckle, right_outer_knuckle, right_finger, right_inner_knuckle]
      left_outer_knuckle: [left_finger, left_inner_knuckle, right_outer_knuckle, right_finger, right_inner_knuckle]
      left_finger: [left_inner_knuckle, right_outer_knuckle, right_finger, right_inner_knuckle]
      left_inner_knuckle: [right_outer_knuckle, right_finger, right_inner_knuckle]
      right_outer_knuckle: [right_finger, right_inner_knuckle]
      right_finger: [right_inner_knuckle]
    self_collision_buffer:
      link_base: 0.0
      link1: 0.0
      link2: 0.0
      link3: 0.0
      link4: 0.0
      link5: 0.0
      link6: 0.0
      xarm_gripper_base_link: 0.0
      left_outer_knuckle: 0.0
      left_finger: 0.0
      left_inner_knuckle: 0.0
      right_outer_knuckle: 0.0
      right_finger: 0.0
      right_inner_knuckle: 0.0
    mesh_link_names:
      - link_base
      - link1
      - link2
      - link3
      - link4
      - link5
      - link6
      - xarm_gripper_base_link
      - left_outer_knuckle
      - left_finger
      - left_inner_knuckle
      - right_outer_knuckle
      - right_finger
      - right_inner_knuckle
    lock_joints:
      drive_joint: 0.0
      left_finger_joint: 0.0
      left_inner_knuckle_joint: 0.0
      right_outer_knuckle_joint: 0.0
      right_finger_joint: 0.0
      right_inner_knuckle_joint: 0.0
    extra_links: null
    cspace:
      joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]
      retract_config: [0.0, -0.5, -1.5, 0.0, 2.0, 0.0]
      null_space_weight: [1, 1, 1, 1, 1, 1]
      cspace_distance_weight: [1, 1, 1, 1, 1, 1]
      max_acceleration: 15.0
      max_jerk: 500.0
planner:
  frame_bias: [0.0, 0.0, 0.0]
